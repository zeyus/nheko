name: macOS Build (Manual, unsigned, compilation only)

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version for aqtinstall'
        required: false
        default: '6.10.2'

jobs:
  build:
    name: Build nheko on macOS (Apple Silicon)
    runs-on: macos-14

    env:
      QT_VERSION: ${{ inputs.qt_version || '6.10.2' }}
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools and GStreamer
        run: |
          brew install cmake ninja pkg-config python3 pipx meson openssl clang-format gstreamer

      - name: Detect GStreamer version and prefix
        run: |
          GST_VERSION="$(brew list --versions gstreamer | awk '{print $2}')"
          GST_PREFIX="$(brew --prefix gstreamer)"
          echo "GST_VERSION=${GST_VERSION}" >> "$GITHUB_ENV"
          echo "GST_PREFIX=${GST_PREFIX}"   >> "$GITHUB_ENV"

      - name: Install Qt via aqtinstall
        run: |
          pipx install aqtinstall
          pipx ensurepath
          mkdir -p "$HOME/qt"
          ~/.local/bin/aqt install-qt \
            --outputdir "$HOME/qt" \
            mac desktop "$QT_VERSION" clang_64 \
            -m qtlocation qtimageformats qtmultimedia qtpositioning qtshadertools

      - name: Cache Hunter dependencies
        uses: actions/cache@v4
        with:
          path: .hunter
          key: hunter-macos-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: hunter-macos-

      - name: Build GStreamer qml6glsink plugin from source
        run: |
          QT_BASEPATH="$HOME/qt/$QT_VERSION/macos"

          # Sparse-clone only gst-plugins-good at the version matching brew's install
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "$GST_VERSION" \
            https://gitlab.freedesktop.org/gstreamer/gstreamer.git \
            /tmp/gstreamer-src
          cd /tmp/gstreamer-src
          git sparse-checkout set subprojects/gst-plugins-good

          cd subprojects/gst-plugins-good

          printf '[binaries]\nmoc = '"'"'%s/bin/moc'"'"'\nrcc = '"'"'%s/bin/rcc'"'"'\nuic = '"'"'%s/bin/uic'"'"'\nqmake = '"'"'%s/bin/qmake6'"'"'\n[cmake]\nCMAKE_DISABLE_FIND_PACKAGE_Qt6 = true\n' \
            "$QT_BASEPATH" "$QT_BASEPATH" "$QT_BASEPATH" "$QT_BASEPATH" \
            > /tmp/nheko-qml6-native.ini

          PKG_CONFIG_PATH="${GST_PREFIX}/lib/pkgconfig" \
          CXXFLAGS="-I${QT_BASEPATH}/lib/QtGui.framework/Headers -I${QT_BASEPATH}/lib/QtGui.framework/Headers/${QT_VERSION}/QtGui -F${QT_BASEPATH}/lib" \
          PATH="${QT_BASEPATH}/bin:$PATH" \
          meson setup build \
            --native-file /tmp/nheko-qml6-native.ini \
            --prefix="${GST_PREFIX}" \
            -Dauto_features=disabled \
            -Dqt6=enabled

          ninja -C build ext/qt6/libgstqml6.dylib
          # Homebrew dirs are user-writable on GitHub Actions runners
          ninja -C build install

      - name: Configure nheko
        run: |
          QT_BASEPATH="$HOME/qt/$QT_VERSION/macos"
          export PATH="${QT_BASEPATH}/bin:${PATH}"
          export PKG_CONFIG_PATH="${GST_PREFIX}/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          export CMAKE_BUILD_PARALLEL_LEVEL="$(sysctl -n hw.ncpu)"

          cmake -GNinja -S. -Bbuild \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="nheko.temp" \
            -DHUNTER_ROOT=".hunter" \
            -DHUNTER_ENABLED=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DKDSingleApplication_STATIC=ON \
            -DKDSingleApplication_EXAMPLES=OFF \
            -DHUNTER_CONFIGURATION_TYPES=RelWithDebInfo \
            -DQt6_DIR="${QT_BASEPATH}/lib/cmake/Qt6" \
            -DCMAKE_PREFIX_PATH="${GST_PREFIX};${QT_BASEPATH}/lib/cmake" \
            -DVOIP=ON \
            -DCI_BUILD=ON \
            -DFETCHCONTENT_QUIET=OFF

      - name: Build nheko
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL="$(sysctl -n hw.ncpu)"
          cmake --build build
